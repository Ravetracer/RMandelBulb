[package]
name = "rmb-net"
version = "0.1.0"
edition = "2024"
license = "LGPL-2.1-or-later"

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
png = { version = "0.18.1", default-features = false }
rmb-core = { version = "0.1.0", path = "../rmb-core" }
rmb-gpu = { version = "0.1.0", path = "../rmb-gpu" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
sysinfo = { version = "0.40.4", default-features = false, features = ["system"] }

[dev-dependencies]
exr = "1.74.3"
