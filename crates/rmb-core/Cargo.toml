[package]
name = "rmb-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "intel", "instr_info"] }
libloading = "0.8"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp", "pnm"] }
png = "0.18"
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tobj = { version = "4.0.5", default-features = false }
stl_io = "0.11.0"
ply-rs-bw = "4.0.1"
gltf = { version = "1.4.1", default-features = false, features = ["import", "utils", "names"] }
ufbx = "0.11.5"
exr = { version = "1.74.3", default-features = false }
cranelift-codegen = "0.138"
cranelift-frontend = "0.138"
cranelift-jit = "0.138"
cranelift-module = "0.138"
cranelift-native = "0.138"
