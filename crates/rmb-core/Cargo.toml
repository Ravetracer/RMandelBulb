[package]
name = "rmb-core"
version = "0.1.0"
edition = "2024"
license = "LGPL-2.1-or-later"

[dependencies]
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "intel", "instr_info"] }
libloading = "0.8"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp", "pnm"] }
png = "0.18"
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
