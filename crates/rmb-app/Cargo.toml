[package]
name = "rmb-app"
version = "0.1.0"
edition = "2024"
license = "LGPL-2.1-or-later"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
egui = "0.36.2"
egui-phosphor = "0.14.0"
egui-wgpu = "0.36.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
png = "0.18.1"
rayon = "1.12"
rfd = "0.17.2"
rmb-core = { version = "0.1.0", path = "../rmb-core" }
rmb-gpu = { version = "0.1.0", path = "../rmb-gpu" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = "30"
