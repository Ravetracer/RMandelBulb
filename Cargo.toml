[workspace]
resolver = "3"
members = ["crates/rmb-core", "crates/rmb-gpu", "crates/rmb-app", "crates/rmb-cli", "crates/rmb-net", "tools/m3f-check"]
# The checker builds the Unicorn emulator (C): only on request (`cargo run -p m3f-check`).
default-members = ["crates/rmb-core", "crates/rmb-gpu", "crates/rmb-app", "crates/rmb-cli", "crates/rmb-net"]

[workspace.package]
version = "1.2.1"
edition = "2024"
license = "LGPL-2.1-or-later"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false
